<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>JMAGS Command Center | Finance & Operations</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#172337;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:#2563eb}
.wrap{max-width:1400px;margin:auto;padding:22px}.top{background:#111e34;color:white;padding:18px 28px;display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}.logo{font-size:21px;font-weight:850;letter-spacing:.3px}.logo span{color:#76b3ff}.small{font-size:12px;color:#64748b}.top .small{color:#bdd0ec}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button{border:1px solid #d9e2ef;background:white;color:#344054;border-radius:11px;padding:10px 15px;font-weight:650}.nav button.active{background:#1957b8;color:#fff;border-color:#1957b8}.panel{background:#fff;border:1px solid #e4eaf2;border-radius:17px;padding:20px;margin:15px 0;box-shadow:0 2px 8px #17233708}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.metric{background:#fff;border:1px solid #e5ebf3;border-radius:15px;padding:17px;min-height:115px}.metric strong{font-size:25px;display:block;margin-top:11px}.metric .small{font-size:13px}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}h1,h2,h3{line-height:1.2}h1{font-size:27px;margin:12px 0 6px}h2{font-size:19px;margin:0 0 17px}h3{font-size:16px;margin:12px 0}p{line-height:1.55}label{font-size:13px;font-weight:650;display:block;color:#475569}input,select,textarea{width:100%;margin-top:7px;padding:10px 12px;border:1px solid #cdd6e3;border-radius:9px;background:white;color:#15243b}input:focus,select:focus,textarea:focus{outline:2px solid #8eb7f8}button.primary{background:#1957b8;color:#fff;padding:11px 16px;border:0;border-radius:10px;font-weight:700}button.secondary{padding:9px 12px;border:1px solid #d6dfe9;background:#fff;border-radius:10px;color:#344054}button.smallbtn{padding:6px 10px;border:1px solid #cad8e9;background:#f7fbff;color:#164a97;border-radius:8px;font-size:12px;font-weight:700;margin-right:4px}.red{color:#bd3434}.green{color:#16803f}.hint{font-size:13px;color:#60728b;line-height:1.45}.banner{border-left:4px solid #2773d2;background:#eaf3ff;padding:13px;border-radius:9px;margin:12px 0}.warn{border-left-color:#d49a24;background:#fff7e8}.bad{border-left-color:#cc4f4f;background:#fff0f0}.good{border-left-color:#259b66;background:#eaf9f1}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}th{text-align:left;font-size:12px;color:#64748b;letter-spacing:.2px;background:#f6f8fb}td,th{padding:10px 12px;border-bottom:1px solid #edf0f5}td.right,th.right{text-align:right}.scroll{overflow:auto;max-width:100%}.pill{border-radius:100px;padding:4px 9px;font-size:11px;font-weight:700;background:#e8ecf3;color:#495a75}.pill.verified{background:#dbf7e8;color:#126c35}.pill.submitted{background:#fff0ca;color:#8a6107}.pill.void{background:#f2dfe2;color:#9b2d36}.cardstat{font-weight:700}.auth{max-width:460px;margin:65px auto}.sectiontitle{display:flex;justify-content:space-between;align-items:center;gap:10px}.foot{font-size:12px;color:#64748b;margin:35px 0}#error{color:#ae2e2e;font-size:13px;min-height:18px}#toast{position:fixed;bottom:18px;right:18px;border-radius:12px;background:#122442;color:white;padding:14px 20px;display:none;max-width:360px;z-index:10}select.filter,input.filter{width:auto;min-width:140px;margin:0}@media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}}@media(max-width:640px){.grid,.cols3{grid-template-columns:1fr}.wrap{padding:12px}.metric strong{font-size:22px}.top{padding:14px}.panel{padding:14px}.auth{margin:30px auto}}
 .ai-output{white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit;line-height:1.65;font-size:14px;margin:0} .claude-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0} .claude-tools button{font-size:12px}

</head><body>
<header class="top"><div><div class="logo">JMAGS <span>COMMAND CENTER</span></div><div class="small">Appliances • San Pablo & Cavite • Finance Automation</div></div><div id="identity" class="small"></div></header>
<main class="wrap"><div id="root"><div class="panel">Loading your secure dashboard…</div></div></main><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<script>
"use strict";
(function(){
const URL_DB="https://fhjarnogglakehaztbbj.supabase.co", PUBLIC_KEY="sb_publishable_KAF6AVi5sUPy09fxS_HdZw_BOFMOt_D";
const root=document.getElementById("root"), identity=document.getElementById("identity");
if(!window.supabase){root.innerHTML='<div class="banner bad">Supabase client could not load. Check your connection or script blocker.</div>';return;}
const db=window.supabase.createClient(URL_DB,PUBLIC_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const state={user:null,profile:null,tab:"Overview",branch:"all",month:new Date().getDate()<=7?monthOffset(-1):monthOffset(0),jobs:[],expenses:[],ads:[],ledger:[],monthly:[],working:false,claudeQuestion:"",claudeAnswer:"",claudeMessage:"",claudeHelpUrl:"",claudeConfigured:null,claudeSetupError:""};
let recoveryMode=false;
function monthOffset(n){const d=new Date(); d.setDate(1);d.setMonth(d.getMonth()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function h(v){return String(v??"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(x){return new Intl.NumberFormat("en-PH",{style:"currency",currency:"PHP",maximumFractionDigits:2}).format(Number(x)||0)}
function n(x){return Math.max(0,Number(x)||0)}
function pct(x){return (x*100).toFixed(1)+"%"}
function dateLocal(){const x=new Date();return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
function role(){return state.profile?.role||"pending"}
function admin(){return role()==="owner"||role()==="staff"}
function toast(message){const e=document.getElementById("toast");e.textContent=message;e.style.display="block";setTimeout(()=>e.style.display="none",4200)}
function status(s){return '<span class="pill '+h(s)+'">'+h(s)+'</span>'}
function fMonth(x){return String(x||"").slice(0,7)===state.month}
function fBranch(x){return state.branch==="all"||x.branch===state.branch||x.branch==="shared"}
function currentJobs(){return state.jobs.filter(x=>fMonth(x.job_date)&&fBranch(x))}
function currentExpenses(){return state.expenses.filter(x=>fMonth(x.expense_date)&&fBranch(x))}
function currentAds(){return state.ads.filter(x=>fMonth(x.ad_date)&&fBranch(x))}
function currentLedger(){return state.ledger.filter(x=>fMonth(x.txn_date)&&fBranch(x))}
function sum(a,k){return a.reduce((v,x)=>v+n(x[k]),0)}
function banner(message,kind){return '<div class="banner '+(kind||"")+'">'+message+'</div>'}
function cell(x,cls){return '<td'+(cls?' class="'+cls+'"':'')+'>'+x+'</td>'}
function table(head,body){return '<div class="scroll"><table><thead><tr>'+head.map(x=>'<th>'+h(x)+'</th>').join("")+'</tr></thead><tbody>'+body.join("")+'</tbody></table></div>'}
async function check(){const auth=await db.auth.getUser();const user=auth.data?.user||null;state.user=user;if(recoveryMode)return;if(!user){login();return}if(auth.error)throw auth.error;
const {data,error}=await db.from("profiles").select("role,name,branch").eq("id",user.id).maybeSingle();
state.profile=data||{role:"pending",name:"",branch:""};identity.innerHTML=h(user.email||"")+" &nbsp; • &nbsp; "+h(role())+' &nbsp; <button class="smallbtn" id="signout">Sign out</button>';
if(error){root.innerHTML=banner(h(error.message),"bad");return}
if(recoveryMode)return;
if(!["owner","staff","tech"].includes(role())){root.innerHTML=banner("Your account has not been assigned a finance role. Ask JMAGS management to approve your role in Supabase. Financial records are protected until approval.","warn");return}
await load();
}
function login(){identity.textContent="Secure access";root.innerHTML='<section class="panel auth"><h1>Sign in to JMAGS</h1><p class="hint">Authorized staff and technicians only. Financial records are protected by account permissions.</p><form id="loginForm"><label>Email<input type="email" name="email" autocomplete="username" required></label><br><label>Password<input type="password" name="password" autocomplete="current-password" required></label><p id="error"></p><button class="primary" type="submit">Sign in</button> <button class="secondary" type="button" id="forgotPassword">Forgot password?</button></form></section>'}
function showStartupError(error){if(/auth session missing|no active session|session not found|authsessionmissing/i.test(String(error?.message||""))){state.user=null;login();return}identity.textContent="Connection needs attention";root.innerHTML='<section class="panel auth"><h1>JMAGS Command Center</h1>'+banner("The dashboard could not complete sign-in or data loading. Your records have not been changed. "+h(error?.message||"Network unavailable."),"warn")+'<p>Check your connection, then retry. If the problem continues, open this page in a private browser window.</p><button class="primary" id="retryLoad">Retry loading</button> <button class="secondary" id="signInAgain">Sign in again</button></section>'}
function showRecovery(){identity.textContent="Reset password";root.innerHTML='<section class="panel auth"><h1>Set a new JMAGS password</h1><form id="newPasswordForm"><label>New password<input type="password" name="password" minlength="8" autocomplete="new-password" required></label><br><label>Confirm new password<input type="password" name="confirm" minlength="8" autocomplete="new-password" required></label><p id="error"></p><button class="primary" type="submit">Update password</button></form></section>'}

async function load(){if(state.working)return;state.working=true;
const q=[["jobs","jmags_finance_jobs"],["expenses","jmags_finance_expenses"],["ads","jmags_ad_spend_daily"],["ledger","jmags_finance_ledger"],["monthly","jmags_monthly_finance"]];
const results=await Promise.all(q.map(async x=>{const {data,error}=await db.from(x[1]).select("*").limit(3000);return {name:x[0],data,error}}));
state.working=false;const errors=[];
for(const r of results){state[r.name]=r.data||[];if(r.error)errors.push(r.name+": "+r.error.message)}
render(errors);
}
function shell(){const menus=admin()?["Overview","Jobs","Expenses","Ads","Ledger",...(role()==="owner"?["Claude AI"]:[])]:["Jobs"];
return '<div class="flex"><div><h1>Finance & Operations</h1><div class="hint">One technician entry → one ledger record → verified monthly reporting.</div></div><div class="flex"><input class="filter" type="month" id="month" value="'+h(state.month)+'"><select class="filter" id="branch"><option value="all">Both branches</option><option value="san_pablo"'+(state.branch==="san_pablo"?" selected":"")+'>San Pablo</option><option value="cavite"'+(state.branch==="cavite"?" selected":"")+'>Cavite</option></select><button class="secondary" id="refresh">↻ Refresh</button></div></div><div class="panel"><nav class="nav">'+menus.map(x=>'<button data-tab="'+x+'" class="'+(state.tab===x?"active":"")+'">'+x+'</button>').join("")+'</nav></div>'}
function render(errors){if(!state.user)return login();if(!admin()&&role()!=="tech")return check();if(!admin()&&state.tab!=="Jobs")state.tab="Jobs";let body=shell();
if(errors?.length)body+=banner("Some records could not be read: "+h(errors.join("; ")),"bad");
if(state.tab==="Overview")body+=overview();
if(state.tab==="Jobs")body+=jobs();
if(state.tab==="Expenses")body+=expenses();
if(state.tab==="Ads")body+=ads();
if(state.tab==="Ledger")body+=ledger();
if(state.tab==="Claude AI"&&role()==="owner")body+=claudePanel();
body+='<div class="foot">Financial reports include verified jobs and expenses only. Ad figures are imported account spend and require periodic sync. Investor-supported costs are shown separately. This dashboard is not a substitute for bank reconciliation or accounting review.</div>';root.innerHTML=body;
}

function claudePanel(){
 const prompts=[["costs","Find cost-saving opportunities without reducing service quality"],["ads","Which ad campaigns need investigation before spending more?"],["branch","Summarize risks and data gaps for the selected branch"]];
 let out='<section class="panel"><div class="sectiontitle"><h2>Claude AI • CEO Finance Advisor</h2><span class="pill verified">Owner only · read-only</span></div>';
 out+='<p class="hint">Ask about verified repair revenue, overhead, and advertising. Only aggregate financial figures are shared with Claude—never customer names, phone numbers, or individual job records. No AI answer changes your ads, ledger, CRM, or Messenger bot.</p>';
 out+='<p class="hint">Maximum 20 requests per day. Your Claude API credential is encrypted in Supabase Vault, not published in this website. Some months and branches are incomplete; recommendations are advisory.</p>';
 out+=claudeActivationPanel();
 out+='<div class="claude-tools">'+prompts.map(x=>'<button class="secondary" type="button" data-claude-prompt="'+x[0]+'">'+h(x[1])+'</button>').join("")+'</div>';
 out+='<form id="claudeForm"><label>Ask Claude about '+h(state.month)+' · '+h(state.branch==="all"?"Both branches":state.branch==="cavite"?"Cavite":"San Pablo")+'<textarea name="question" rows="3" maxlength="500" placeholder="Example: How can JMAGS reduce expenses this month?" required>'+h(state.claudeQuestion)+'</textarea></label><p><button class="primary" type="submit">Ask Claude</button></p></form>';
 if(state.claudeMessage)out+=banner(h(state.claudeMessage),state.claudeAnswer?"good":"warn");
 if(state.claudeHelpUrl==="https://platform.claude.com/settings/billing")out+='<p><a target="_blank" rel="noopener noreferrer" href="https://platform.claude.com/settings/billing">Open Claude Console billing & API credits</a></p>';
 if(state.claudeAnswer)out+='<div class="panel"><h3>Claude advice</h3><div class="ai-output">'+h(state.claudeAnswer)+'</div></div>';
 return out+'</section>';
}
function claudeActivationPanel(){
 const activated=state.claudeConfigured===true;
 let out='<div class="panel">';
 if(activated)out+='<p class="green"><strong>Claude key is saved securely.</strong> You can replace it below if required.</p><details><summary>Replace Claude API key</summary>';
 else out+='<h3>Activate Claude</h3><p class="hint">Create a fresh API key in your Claude Console and enter it below. The key you previously sent in chat must be revoked, not reused.</p>';
 out+='<form id="claudeKeyForm" autocomplete="off"><label>New Anthropic API key<input type="password" name="api_key" minlength="45" maxlength="512" autocomplete="new-password" autocapitalize="off" spellcheck="false" placeholder="Paste your new private API key here" required></label><p><button class="primary" type="submit">Save key securely & activate Claude</button></p></form>';
 if(activated)out+='</details>';
 if(state.claudeConfigured===null)out+='<p class="hint">Checking activation status…</p>';
 if(state.claudeSetupError)out+=banner(h(state.claudeSetupError),"warn");
 out+='</div>';return out;
}
async function checkClaudeStatus(){
 const r=await db.rpc("jmags_claude_is_configured");
 if(r.error){state.claudeConfigured=null;state.claudeSetupError="Unable to check Claude activation status. Please refresh.";}
 else {state.claudeConfigured=!!r.data;state.claudeSetupError="";}
 if(state.tab==="Claude AI")render();
}
async function saveClaudeKey(form){
 if(role()!=="owner")throw Error("Only the approved JMAGS owner can activate Claude.");
 const field=form.querySelector('input[name="api_key"]');
 const key=String(field?.value||"").trim();
 if(!key.startsWith("sk-ant-")||key.length<45||key.length>512)throw Error("Please create a new Anthropic API key in Claude Console.");
 try {
   const r=await db.rpc("jmags_claude_store_key",{p_key:key});
   if(r.error)throw r.error;
   if(r.data!==true)throw Error("The key could not be saved.");
   state.claudeConfigured=true;
   state.claudeSetupError="";
   state.claudeMessage="API key saved in encrypted Supabase Vault. Now ask Claude a question to verify your API access.";
   state.claudeAnswer="";
   render();
 }finally{if(field)field.value="";}
}
async function askClaude(form){
 if(role()!=="owner")throw Error("Only the JMAGS owner can use Claude.");
 const question=String(new FormData(form).get("question")||"").trim();
 if(!question||question.length>500)throw Error("Enter a question up to 500 characters.");
 state.claudeQuestion=question;
 const send=form.querySelector('button[type="submit"]');
 if(send)send.textContent="Consulting Claude…";
 state.claudeAnswer="";
 state.claudeHelpUrl="";
 state.claudeMessage="Analyzing summarized finance data securely…";
 const result=await db.functions.invoke("jmags-claude-advisor",{body:{month:state.month,branch:state.branch,question}});
 if(result.error){
   let errorText=result.error.message||"Claude API unavailable";
   try{if(result.error.context?.json){const detail=await result.error.context.json();if(detail.error)errorText=detail.error;if(detail.helpUrl==="https://platform.claude.com/settings/billing")state.claudeHelpUrl=detail.helpUrl}}catch(_){}
   state.claudeMessage=errorText;
   render();return;
 }
 if(!result.data?.answer){state.claudeMessage="Claude did not return an answer.";render();return}
 state.claudeAnswer=String(result.data.answer);
 state.claudeMessage="Claude Sonnet • "+state.month+" • "+(result.data.availableRecords||0)+" reporting rows. Advisory only; no business records changed.";
 render();
}

function overview(){const j=currentJobs().filter(x=>x.status==="verified"),e=currentExpenses().filter(x=>x.status==="verified"),a=currentAds();
const revenue=sum(j,"collected"),costs=sum(j,"direct_costs"),adsCost=sum(a,"amount"),expense=sum(e.filter(x=>x.payer==="jmags"),"amount"),investor=sum(e.filter(x=>x.payer==="investor"),"amount"),profit=revenue-costs-adsCost-expense;
const pending=currentJobs().filter(x=>x.status==="submitted").length+currentExpenses().filter(x=>x.status==="submitted").length;
let alerts=[];if(revenue>0&&adsCost/revenue>.2)alerts.push("Facebook advertising exceeded 20% of recorded verified sales.");if(revenue>0&&(revenue-costs)/revenue<.3)alerts.push("Direct job contribution fell below 30% of sales.");if(profit<0)alerts.push("The selected period is showing a loss after recorded costs.");if(pending>0)alerts.push(pending+" submitted job/expense record(s) need verification.");if(!revenue&&adsCost)alerts.push("Ads are recorded but there are no verified sales for this period.");
let out='<div class="grid">'+[["Verified Sales",money(revenue),j.length+" completed jobs"],["Direct Job Costs",money(costs),"Includes technician and agent fees"],["Facebook Ads",money(adsCost),a.length+" campaign-day records"],["Branch Profit",money(profit),"After direct costs, ads and JMAGS overhead"]].map(x=>'<div class="metric"><span class="small">'+x[0]+'</span><strong>'+x[1]+'</strong><div class="small">'+x[2]+'</div></div>').join("")+'</div>';
out+='<div class="row"><section class="panel"><h2>Profit breakdown</h2>'+table(["Item","PHP"],[
'<tr>'+cell("Sales collected")+cell(money(revenue),"right")+'</tr>',
'<tr>'+cell("Direct job costs")+cell("− "+money(costs),"right")+'</tr>',
'<tr>'+cell("Facebook ad spend")+cell("− "+money(adsCost),"right")+'</tr>',
'<tr>'+cell("JMAGS-paid overhead")+cell("− "+money(expense),"right")+'</tr>',
'<tr>'+cell("<b>Branch profit</b>")+cell("<b>"+money(profit)+"</b>","right")+'</tr>',
'<tr>'+cell("Investor-supported costs (reported separately)")+cell(money(investor),"right")+'</tr>',
'<tr>'+cell("Fully loaded profit (economic view)")+cell(money(profit-investor),"right")+'</tr>'
])+'</section><section class="panel"><h2>Management alerts</h2>'+(alerts.length?alerts.map(x=>banner(h(x),"warn")).join(""):banner("No current threshold alerts for this selected period.","good"))+'<p class="hint">Alerts are advisory. Do not automatically pause campaigns or change salary arrangements based on partial records.</p></section></div>';
return out+(state.month==="2026-10"&&(state.branch==="all"||state.branch==="cavite")?banner("Important: October 2026 imported advertising is live in the ledger, but historical October sales from the old Excel file have not been imported. Do not interpret the resulting October profit as final until the historical sales and expenses are reconciled.","warn"):"");
}
function input(name,label,type,attrs){return '<label>'+label+'<input name="'+name+'" type="'+(type||"text")+'" '+(attrs||"")+'></label>'}
function jobForm(){return '<section class="panel"><h2>Technician job submission</h2><p class="hint">Submit once after collecting payment. A submitted job appears in the ledger immediately. The manager verifies it before finalized profit includes it. Never re-enter the same job number.</p><form id="jobForm"><div class="cols3">'+input("job_no","Job / service number","text","required maxlength=80")+ '<label>Branch<select name="branch"><option value="san_pablo">San Pablo</option><option value="cavite">Cavite</option></select></label>'+input("job_date","Job date","date",'required value="'+dateLocal()+'"')+input("customer","Customer (optional)")+input("service","Repair / service")+input("technician","Technician")+input("ad_campaign","Ad campaign / source (if known)")+input("collected","Amount actually collected ₱","number",'required min="0" step="0.01"')+input("parts_cost","Parts ₱","number",'min="0" step="0.01" value="0"')+input("driver_cost","Driver ₱","number",'min="0" step="0.01" value="0"')+input("assistant_cost","Assistant ₱","number",'min="0" step="0.01" value="0"')+input("transport_cost","Gas / toll / travel ₱","number",'min="0" step="0.01" value="0"')+input("technician_commission","Technician commission ₱","number",'min="0" step="0.01" value="0"')+input("sales_agent_fee","Sales agent fee ₱ (₱300 if booked)","number",'min="0" step="0.01" value="0"')+input("other_job_cost","Other job costs ₱","number",'min="0" step="0.01" value="0"')+'</div><p><label>Notes<textarea name="notes" rows="2"></textarea></label></p><button class="primary" type="submit">Submit job to automatic ledger</button></form></section>'}
function jobs(){const j=currentJobs().slice().sort((a,b)=>String(b.job_date).localeCompare(String(a.job_date)));
let out=jobForm()+'<section class="panel"><div class="sectiontitle"><h2>Job records ('+j.length+')</h2><span class="hint">Verified jobs count toward P&L</span></div>';
if(!j.length)return out+'<p class="hint">No jobs entered for this selected period.</p></section>';
return out+table(["Date","Job no.","Branch","Technician","Collected","Direct cost","Contribution","Status","Actions"],j.map(x=>'<tr>'+cell(h(x.job_date))+cell(h(x.job_no))+cell(h(x.branch))+cell(h(x.technician))+cell(money(x.collected),"right")+cell(money(x.direct_costs),"right")+cell('<b>'+money(x.contribution)+'</b>')+cell(status(x.status))+cell(x.status==="submitted"&&admin()?'<button class="smallbtn" data-verify-job="'+h(x.id)+'">Verify</button><button class="smallbtn" data-void-job="'+h(x.id)+'">Void</button>':"")+'</tr>'))+'</section>';
}
function expenseForm(){return '<section class="panel"><h2>Submit branch expense</h2><p class="hint">Record business expenses here. Facebook ads must come through the ads sync, not a second expense entry. Do not double-count parts or labor already entered on jobs.</p><form id="expenseForm"><div class="cols3">'+input("expense_date","Expense date","date",'required value="'+dateLocal()+'"')+'<label>Branch<select name="branch"><option value="san_pablo">San Pablo</option><option value="cavite">Cavite</option><option value="shared">Shared</option></select></label><label>Expense type<select name="category"><option>Vehicle maintenance</option><option>Rent</option><option>Utilities</option><option>Salary / admin payroll</option><option>Tools</option><option>Supplies</option><option>Other operating expense</option></select></label>'+input("amount","Amount ₱","number",'required min="0" step="0.01"')+'<label>Paid by<select name="payer"><option value="jmags">JMAGS</option><option value="investor">Investor supported</option></select></label>'+input("notes","Notes / receipt reference")+'</div><p><button class="primary">Submit expense</button></p></form></section>'}
function expenses(){const e=currentExpenses().slice().sort((a,b)=>String(b.expense_date).localeCompare(String(a.expense_date)));return expenseForm()+'<section class="panel"><h2>Expense approvals</h2>'+(e.length?table(["Date","Branch","Category","Amount","Paid by","Status","Actions"],e.map(x=>'<tr>'+cell(h(x.expense_date))+cell(h(x.branch))+cell(h(x.category))+cell(money(x.amount))+cell(h(x.payer))+cell(status(x.status))+cell(x.status==="submitted"&&admin()?'<button class="smallbtn" data-verify-expense="'+h(x.id)+'">Verify</button><button class="smallbtn" data-void-expense="'+h(x.id)+'">Void</button>':"")+'</tr>')):'<p class="hint">No expenses recorded for this period.</p>')+'</section>'}
function ads(){const a=currentAds(),j=currentJobs().filter(x=>x.status==="verified"),by={};
a.forEach(x=>{const k=x.campaign||"Unnamed";if(!by[k])by[k]={spend:0,messages:0};by[k].spend+=n(x.amount);by[k].messages+=n(x.messages)});
const out=Object.keys(by).sort((a,b)=>by[b].spend-by[a].spend).map(k=>{const x=by[k],jobs=j.filter(y=>y.ad_campaign===k),contrib=sum(jobs,"contribution");
return '<tr>'+cell(h(k))+cell(money(x.spend),"right")+cell(x.messages.toLocaleString(),"right")+cell(x.messages?money(x.spend/x.messages):"—","right")+cell(jobs.length.toString(),"right")+cell(jobs.length?money(contrib-x.spend):"Not attributed","right")+'</tr>'});
return '<section class="panel"><h2>Meta Ads • Campaign profitability</h2><p class="hint">Source: Windsor.ai, Cavite ad account. Actual cost per completed repair is shown only when verified jobs use the exact campaign name. A Messenger conversation is not a booking. Synced historical data: October 2026; subsequent days need recurring sync.</p>'+table(["Campaign","Spend","Messages","Cost / message","Linked paid jobs","Contribution after ads"],out)+'</section>'+banner("Decision rule: compare verified job contribution after direct costs against campaign spend before scaling or pausing an ad. Do not assume campaigns without attributed jobs produced no sales.","warn");
}
function ledger(){const r=currentLedger().slice().sort((a,b)=>String(b.txn_date).localeCompare(String(a.txn_date)));return '<section class="panel"><div class="sectiontitle"><h2>Automatic finance ledger ('+r.length+')</h2><button class="secondary" id="exportCSV">Export CSV</button></div><p class="hint">Positive = sales; negative = cost. Submitted entries appear instantly but are not treated as finalized profit. Ads are recorded once in their own source table.</p>'+(r.length?table(["Date","Branch","Category","Reference","Amount","Status","Source"],r.map(x=>'<tr>'+cell(h(x.txn_date))+cell(h(x.branch))+cell(h(x.category))+cell(h(x.reference))+cell('<b>'+money(x.amount)+'</b>')+cell(status(x.status))+cell(h(x.source))+'</tr>')):'<p>No ledger entries for selected period.</p>')+'</section>'}
async function saveJob(form){const f=new FormData(form),x={};["job_no","branch","job_date","customer","service","technician","ad_campaign","notes"].forEach(k=>x[k]=String(f.get(k)||"").trim());["collected","parts_cost","driver_cost","assistant_cost","transport_cost","technician_commission","sales_agent_fee","other_job_cost"].forEach(k=>x[k]=n(f.get(k)));x.submitted_by=state.user.id;x.status="submitted";x.source="command_center";if(!x.job_no||!x.job_date)throw Error("Job number and date required");const r=await db.from("jmags_finance_jobs").insert(x);if(r.error)throw r.error;toast("Job submitted. Ledger updated; awaiting verification.");await load()}
async function saveExpense(form){const f=new FormData(form);const x={expense_date:f.get("expense_date"),branch:f.get("branch"),category:f.get("category"),payer:f.get("payer"),notes:String(f.get("notes")||""),amount:n(f.get("amount")),status:"submitted",submitted_by:state.user.id};const r=await db.from("jmags_finance_expenses").insert(x);if(r.error)throw r.error;toast("Expense submitted for verification.");await load()}
async function approve(table,id,newStatus){if(!admin())return;const fields={status:newStatus,verified_by:state.user.id,verified_at:new Date().toISOString(),updated_at:new Date().toISOString()};const r=await db.from(table).update(fields).eq("id",id).eq("status","submitted").select("id");if(r.error)throw r.error;if(!r.data||!r.data.length)throw Error("Record was already changed or you lack permission");toast("Record "+newStatus+".");await load()}
function download(){const r=currentLedger(),heads=["Date","Branch","Category","Reference","Amount","Status","Source"];const lines=[heads,...r.map(x=>[x.txn_date,x.branch,x.category,x.reference,x.amount,x.status,x.source])].map(a=>a.map(x=>'"'+String(x??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");const blob=new Blob(["\uFEFF"+lines],{type:"text/csv;charset=utf-8"});const u=window.URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="JMAGS-Ledger-"+state.month+".csv";a.click();window.URL.revokeObjectURL(u)}
document.addEventListener("submit",async e=>{if(!["loginForm","jobForm","expenseForm","newPasswordForm","claudeForm","claudeKeyForm"].includes(e.target.id))return;e.preventDefault();const b=e.target.querySelector("button[type=submit],button.primary");if(b)b.disabled=true;try{if(e.target.id==="loginForm"){const f=new FormData(e.target),r=await db.auth.signInWithPassword({email:String(f.get("email")),password:String(f.get("password"))});if(r.error)throw r.error;await check()}else if(e.target.id==="newPasswordForm"){const f=new FormData(e.target);if(String(f.get("password"))!==String(f.get("confirm")))throw Error("Passwords do not match.");const r=await db.auth.updateUser({password:String(f.get("password"))});if(r.error)throw r.error;recoveryMode=false;toast("Password changed successfully.");await check()}else if(e.target.id==="claudeKeyForm")await saveClaudeKey(e.target);else if(e.target.id==="claudeForm")await askClaude(e.target);else if(e.target.id==="jobForm")await saveJob(e.target);else await saveExpense(e.target)}catch(err){toast("Error: "+err.message);const el=document.getElementById("error");if(el)el.textContent=err.message}finally{if(b)b.disabled=false}});
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;try{if(b.id==="signout"){await db.auth.signOut();state.user=null;login();return}if(b.id==="retryLoad"){login();check().catch(showStartupError);return}if(b.id==="signInAgain"){await db.auth.signOut();state.user=null;login();return}if(b.id==="forgotPassword"){const email=document.querySelector('#loginForm input[name="email"]')?.value?.trim();if(!email){const el=document.getElementById("error");if(el)el.textContent="Enter your email first, then click Forgot password.";return}const r=await db.auth.resetPasswordForEmail(email,{redirectTo:"https://jmagsappliances.tech/finance/"});if(r.error)throw r.error;const el=document.getElementById("error");if(el){el.style.color="#16803f";el.textContent="If this email is registered, a password-reset message will arrive. Check your inbox and spam folder."}return}if(b.dataset.claudePrompt){const texts={costs:"Find cost-saving opportunities without reducing service quality",ads:"Which ad campaigns need investigation before spending more?",branch:"Summarize risks and data gaps for the selected branch"};const area=document.querySelector('#claudeForm textarea[name="question"]');if(area){area.value=texts[b.dataset.claudePrompt]||"";area.focus()}return}if(b.dataset.tab){state.tab=b.dataset.tab;render();if(state.tab==="Claude AI"&&role()==="owner")await checkClaudeStatus();return}if(b.id==="refresh"){await load();return}if(b.id==="exportCSV"){download();return}for(const [key,t,st] of [["verifyJob","jmags_finance_jobs","verified"],["voidJob","jmags_finance_jobs","void"],["verifyExpense","jmags_finance_expenses","verified"],["voidExpense","jmags_finance_expenses","void"]])if(b.dataset[key]){if(st==="void"&&!confirm("Void this submission?"))return;await approve(t,b.dataset[key],st);return}}catch(err){toast(err.message)}});
document.addEventListener("change",e=>{if(e.target.id==="month"){state.month=e.target.value;state.claudeAnswer="";state.claudeMessage="";state.claudeQuestion="";render()}if(e.target.id==="branch"){state.branch=e.target.value;state.claudeAnswer="";state.claudeMessage="";state.claudeQuestion="";render()}});
db.auth.onAuthStateChange((event,_session)=>{if(event==="PASSWORD_RECOVERY"){recoveryMode=true;showRecovery()}});login();check().catch(showStartupError);
window.addEventListener("unhandledrejection",event=>{if(root?.textContent?.includes("Loading your secure dashboard"))showStartupError(event.reason||new Error("A service did not respond."))});
setInterval(()=>{if(state.user&&!recoveryMode&&["owner","staff","tech"].includes(role())&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest("form")))load().catch(showStartupError)},60000);
})();
</script></body></html>
