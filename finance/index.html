async function submitClaudeChat(form){

   state.claudeChatError="Direct Claude API chat is currently switched off to avoid extra charges. Your Claude Pro subscription alone cannot enable replies inside this site. Use the Claude Pro option below or approve API credits to activate in-dashboard responses.";
   render();return;

 state.claudeChatBusy=true;
 state.claudeChatError="";

 finally{state.claudeChatBusy=false;render();}

 "Unverified job/expense submissions: "+(currentJobs().filter(x=>x.status==="submitted").length+currentExpenses().filter(x=>x.status==="submitted").length),
 "Facebook campaigns by imported spend (top 6):"
 ];
 for(const [name,v] of top){lines.push(" - "+name.slice(0,100)+": "+money(v.spend)+", "+Math.round(v.messages)+" Messenger conversation-start events")}
 if(!top.length)lines.push(" - No imported advertising data for this selected period.");
 lines.push(

 return lines.join("\n");

 const part=k=>parts.find(x=>x.type===k)?.value||"";

}

async function saveJob(form){const f=new FormData(form),x={};["job_no","branch","job_date","customer","service","technician","ad_campaign","notes"].forEach(k=>x[k]=String(f.get(k)||"").trim());["collected","parts_cost","driver_cost","assistant_cost","transport_cost","technician_commission","sales_agent_fee","other_job_cost"].forEach(k=>x[k]=n(f.get(k)));x.submitted_by=state.user.id;x.status="submitted";x.source="command_center";if(!x.job_no||!x.job_date)throw Error("Job number and date required");const r=await db.from("jmags_finance_jobs").insert(x);if(r.error)throw r.error;toast("Job submitted. Ledger updated; awaiting verification.");await load()}
async function saveExpense(form){const f=new FormData(form);const x={expense_date:f.get("expense_date"),branch:f.get("branch"),category:f.get("category"),payer:f.get("payer"),notes:String(f.get("notes")||""),amount:n(f.get("amount")),status:"submitted",submitted_by:state.user.id};const r=await db.from("jmags_finance_expenses").insert(x);if(r.error)throw r.error;toast("Expense submitted for verification.");await load()}

function download(){const r=currentLedger(),heads=["Date","Branch","Category","Reference","Amount","Status","Source"];const lines=[heads,...r.map(x=>[x.txn_date,x.branch,x.category,x.reference,x.amount,x.status,x.source])].map(a=>a.map(x=>'"'+String(x??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");const blob=new Blob(["\uFEFF"+lines],{type:"text/csv;charset=utf-8"});const u=window.URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="JMAGS-Ledger-"+state.month+".csv";a.click();window.URL.revokeObjectURL(u)}
document.addEventListener("submit",async e=>{if(!["loginForm","jobForm","expenseForm","newPasswordForm","claudeChatForm","ledgerReviewForm"].includes(e.target.id))return;e.preventDefault();const b=e.target.querySelector("button[type=submit],button.primary");if(b)b.disabled=true;try{if(e.target.id==="loginForm"){const f=new FormData(e.target),r=await db.auth.signInWithPassword({email:String(f.get("email")),password:String(f.get("password"))});if(r.error)throw r.error;await check()}else if(e.target.id==="newPasswordForm"){const f=new FormData(e.target);if(String(f.get("password"))!==String(f.get("confirm")))throw Error("Passwords do not match.");const r=await db.auth.updateUser({password:String(f.get("password"))});if(r.error)throw r.error;recoveryMode=false;toast("Password changed successfully.");await check()}else if(e.target.id==="ledgerReviewForm")await reviewAndVerifyLedger(e.target);else if(e.target.id==="claudeChatForm")await submitClaudeChat(e.target);else if(e.target.id==="jobForm")await saveJob(e.target);else await saveExpense(e.target)}catch(err){toast("Error: "+err.message);const el=document.getElementById("error");if(el)el.textContent=err.message}finally{if(b)b.disabled=false}});

finance_jobs","void"],["verifyExpense","jmags_finance_expenses","verified"],["voidExpense","jmags_finance_expenses","void"]])if(b.dataset[key]){if(st==="void"&&!confirm("Void this submission?"))return;await approve(t,b.dataset[key],st);return}}catch(err){toast(err.message)}});
document.addEventListener("change",e=>{if(e.target.id==="ledgerStatusFilter"){state.ledgerStatusFilter=e.target.value;state.ledgerReviewId=null;render();return}if(e.target.id==="month"){state.month=e.target.value;state.claudeAnswer="";state.claudeMessage="";state.claudeQuestion="";state.claudeBrief="";render()}if(e.target.id==="branch"){state.branch=e.target.value;state.claudeAnswer="";state.claudeMessage="";state.claudeQuestion="";state.claudeBrief="";render()}});

// Realtime finance changes from JMAGS Operations. Polling is a fallback for dropped websocket events.
let opsRefreshTimer=null;
let opsRefreshQueued=false;
function refreshOpsFinanceSoon(){
 if(!state.user||recoveryMode)return;
 if(state.working){opsRefreshQueued=true;return;}
 if(opsRefreshTimer)clearTimeout(opsRefreshTimer);
 opsRefreshTimer=setTimeout(async()=>{
  opsRefreshTimer=null;
  if(state.working){opsRefreshQueued=true;return;}
  try{await load();if(state.tab==="Ads")await loadMediaBuyer();}catch(error){console.warn("Finance refresh failed",error)}
  if(opsRefreshQueued){opsRefreshQueued=false;refreshOpsFinanceSoon();}
 },500);
}
const opsRealtime=db.channel("jmags-finance-live")
 .on("postgres_changes",{event:"*",schema:"public",table:"jmags_finance_jobs"},refreshOpsFinanceSoon)
 .on("postgres_changes",{event:"*",schema:"public",table:"jmags_finance_expenses"},refreshOpsFinanceSoon)
 .on("postgres_changes",{event:"*",schema:"public",table:"app_docs",filter:"collection=eq.jobs"},refreshOpsFinanceSoon)
 .on("postgres_changes",{event:"*",schema:"public",table:"app_docs",filter:"collection=eq.payments"},refreshOpsFinanceSoon)
 .subscribe(status=>{if(status==="CHANNEL_ERROR"||status==="TIMED_OUT")console.warn("JMAGS realtime disconnected; polling remains active")});
window.addEventListener("focus",refreshOpsFinanceSoon);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshOpsFinanceSoon()});
setInterval(()=>{if(state.user&&!recoveryMode&&!document.hidden)refreshOpsFinanceSoon()},10000);

})();
